<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evil2Ban</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23e5484d'/></svg>">
<script>
  // đặt sáng/tối trước khi vẽ để không chớp màu
  (function () {
    var m = "dark"; try { m = localStorage.getItem("e2b_theme") || "dark"; } catch (e) { }
    if (m === "system") m = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = m;
  })();
</script>
<link rel="stylesheet" href="css/style.css?v=1.2.2">
</head>
<body>

<!-- ĐĂNG NHẬP -->
<div id="login" class="login hidden">
  <div class="login-card">
    <div class="login-brand">
      <span class="logo-tile"><span class="logo-dot"></span></span>
      <span class="login-name">Evil2Ban</span>
      <p data-i18n="login.subtitle"></p>
    </div>
    <form class="form" id="login-form" novalidate>
      <div class="field">
        <label for="lg-user" data-i18n="login.user"></label>
        <input class="input" type="text" id="lg-user" data-i18n-ph="login.userPh" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <div class="field-row">
          <label for="lg-pass" data-i18n="login.pass"></label>
          <button type="button" class="link" id="lg-reset" data-i18n="login.forgot"></button>
        </div>
        <div class="input-wrap">
          <input class="input" type="password" id="lg-pass" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="eye" id="lg-eye"></button>
        </div>
        <p class="field-err hidden" id="lg-err" role="alert"></p>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="lg-submit" data-i18n="login.submit"></button>
    </form>
    <div class="login-foot">
      <p id="lg-foot"></p>
      <div class="lang-seg" style="display:inline-flex;margin-top:12px" data-lang-seg>
        <button type="button" data-lang="vi">VI</button><button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <span class="logo-dot"></span>
      <span class="sb-name sb-fade">Evil2Ban</span>
      <span class="sb-ver sb-fade" id="sb-ver"></span>
    </div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-foot">
      <div class="account">
        <span class="avatar" id="acc-avatar">A</span>
        <div class="acc-text sb-fade">
          <p class="acc-name trunc" id="acc-name"></p>
          <p class="acc-host trunc" id="acc-host">—</p>
        </div>
        <button type="button" class="logout sb-fade" id="logout" data-sb-hide data-i18n-title="logout"><span data-icon="log-out"></span></button>
      </div>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <div class="content">
    <header class="topbar">
      <button type="button" class="burger" id="burger"><span data-icon="menu" data-cls="ico-5"></span></button>
      <button type="button" class="sb-toggle" id="sb-toggle"></button>
      <h1 class="trunc" id="title"></h1>
      <div class="top-right">
        <span class="live-chip off" id="live-chip"><span class="live-dot"></span><span id="live-text"></span></span>
        <div class="lang-seg" data-lang-seg><button type="button" data-lang="vi">VI</button><button type="button" data-lang="en">EN</button></div>
        <button type="button" class="icon-btn" id="theme-btn"></button>
        <div class="bell-wrap" id="bell-wrap">
          <button type="button" class="icon-btn" id="bell-btn" aria-haspopup="true" aria-expanded="false"><span data-icon="bell"></span><span class="bell-badge hidden" id="bell-badge">0</span></button>
          <div class="pop pop-alerts hidden" id="bell-pop"></div>
        </div>
      </div>
    </header>
    <main class="main">
      <div class="page">
        <section class="view" id="view-dashboard"></section>
        <section class="view hidden" id="view-monitor"></section>
        <section class="view hidden" id="view-blacklist">
          <div class="toolbar" id="bl-toolbar"></div>
          <div class="cf-note" id="bl-note"></div>
          <div id="bl-card"></div>
        </section>
        <section class="view hidden" id="view-domains"></section>
        <section class="view hidden" id="view-audit"></section>
        <section class="view hidden" id="view-settings"></section>
      </div>
    </main>
  </div>
</div>

<script src="vendor/sweetalert2.min.js?v=11.14.5"></script>
<script src="js/icons.js?v=1.2.2"></script>
<script src="js/i18n.js?v=1.2.2"></script>
<script src="js/app.js?v=1.2.2"></script>
</body>
</html>
